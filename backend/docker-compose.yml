services:
  backend:
    build:
      context: ./
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # ✅ Mot de passe aligné avec POSTGRES_PASSWORD ci-dessous
      - DATABASE_URL=postgresql://postgres:Mysq@l123@db:5432/mydb
      - CHOKIDAR_USEPOLLING=true
      # ✅ Clé JWT centralisée (utilisée si votre code lit process.env.JWT_SECRET)
      - JWT_SECRET=ma_cle_secrete_tres_longue_et_unique_a_changer
    depends_on:
      - db
    volumes:
      - ./:/app/
      - /app/node_modules

  db:
    image: postgres:15
    restart: always
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mysql@123      # ✅ Identique à DATABASE_URL
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: